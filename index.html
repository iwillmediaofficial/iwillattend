<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c2e52" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IWILL Attend" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Selfie and location based attendance, leave and payroll for office and field staff." />
    <title>IWILL Attend</title>
  </head>
  <body>
    <div id="root">
      <style>
        @keyframes boot-scan { 0%, 100% { top: 14%; } 50% { top: 80%; } }
        .boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; }
        .boot-box { position: relative; width: 64px; height: 64px; }
        .boot-frame { position: absolute; inset: 0; border: 3px solid #04837f; border-radius: 14px;
          clip-path: polygon(0 0,30% 0,30% 30%,0 30%,0 70%,30% 70%,30% 100%,0 100%,0 0,100% 0,100% 100%,70% 100%,70% 70%,100% 70%,100% 30%,70% 30%,70% 0); }
        .boot-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .boot-line { position: absolute; left: 8%; right: 8%; height: 2px; border-radius: 2px; background: #33a101; animation: boot-scan 1.6s ease-in-out infinite; }
      </style>
      <div class="boot" role="status" aria-label="Loading IWILL Attend">
        <div class="boot-box">
          <div class="boot-frame"></div>
          <div class="boot-face">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0c2e52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
          </div>
          <div class="boot-line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
